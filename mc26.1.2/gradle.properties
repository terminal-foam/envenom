# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# GameTest runs do not serialize cleanly with the configuration cache.
org.gradle.configuration-cache=false

# Environment Properties
# NeoForge for 26.1.2: use .122 to match the target modpack (.124 also works)
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.122

## Mod Properties

mod_id=envenom
mod_name=Envenom
mod_license=GPL-3.0 with additional non-commercial terms
# Same behavior as the audited 1.21.1 1.0.1. The jar name adds +mc26.1.2.
mod_version=1.2.0
mod_group_id=com.terminalfoam.envenom

